worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location /api/repository/ {
            client_max_body_size 33m;
            set $repository http://repository:8081;
            proxy_pass $repository;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
            add_header Cache-Control "no-store" always;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /sw.js {
            add_header Cache-Control "no-store, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        # CheerpJ must receive genuine 206 / Content-Range responses for JARs.
        # Do not replace missing engine files with the React document.
        location /engine/ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
